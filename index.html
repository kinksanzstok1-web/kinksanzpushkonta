<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kink Sanz | PushKontak QR</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#06152f,#082b58,#04101f);color:#fff;font-family:Arial;padding:18px}.wrap{max-width:760px;margin:auto}.card{background:#0a1c36e8;border:1px solid #195085;border-radius:18px;padding:17px;margin:13px 0}h1{color:#5ecbff;margin:0}.sub,.note,.small{color:#a9c2db}label{display:block;margin:12px 0 7px;font-weight:700}textarea{width:100%;min-height:120px;background:#071a32;border:1px solid #285b8c;border-radius:11px;color:#fff;padding:12px;font-size:15px}button{width:100%;border:0;border-radius:11px;padding:12px;margin-top:9px;background:#1098e8;color:#fff;font-weight:800}button:disabled{opacity:.45}.qr{text-align:center}.qr img{max-width:260px;background:#fff;padding:8px;border-radius:12px}.item{background:#071a32;border:1px solid #1c4770;border-radius:11px;padding:10px;margin-top:8px}.timer{text-align:center;color:#5ecbff;font-size:20px;font-weight:800;margin:10px}.check{display:flex;gap:8px;font-size:13px;color:#d9eaff}.check input{width:auto}</style></head><body><div class="wrap">
<div class="card"><h1>KINK SANZ</h1><div class="sub">PushKontak — QR Queue</div></div>
<div class="card"><b>Status: <span id="st">MEMUAT</span></b><div id="qr" class="qr"></div><div class="note">Gunakan hanya untuk penerima yang sudah opt-in.</div></div>
<div class="card"><label>Nomor WhatsApp — satu per baris</label><textarea id="nums" placeholder="628123456789&#10;628987654321"></textarea><label>Pesan</label><textarea id="msg" placeholder="Tulis pesan..."></textarea><label class="check"><input id="ok" type="checkbox"> Saya memastikan semua nomor sudah memberikan izin menerima pesan.</label><button id="load">MASUKKAN KE ANTRIAN</button><div id="stats" class="note"></div><div id="timer" class="timer"></div><div id="queue"></div></div></div>
<script>
const $=x=>document.getElementById(x);let q=[],busy=false,cool=false,timer;
function render(){queue.innerHTML="";q.forEach((x,i)=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<b>${i+1}. ${x.n}</b><div class="small">${x.sent?"TERKIRIM":"MENUNGGU"}</div>`;let b=document.createElement("button");b.textContent=x.sent?"SUDAH TERKIRIM":"KIRIM NOMOR INI";b.disabled=x.sent||busy||cool;b.onclick=()=>send(i);d.appendChild(b);queue.appendChild(d)});stats.textContent=`Total: ${q.length} | Terkirim: ${q.filter(x=>x.sent).length} | Sisa: ${q.filter(x=>!x.sent).length}`}
function delay(s,cb){let t=s;timer=setInterval(()=>{timer.textContent=t>0?`Tunggu ${t} detik`:"";if(--t<0){clearInterval(timer);cb()}},1000)}
async function send(i){if(!q[i]||q[i].sent)return;if(!$("ok").checked){alert("Centang konfirmasi opt-in.");return}busy=true;render();try{let r=await fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({number:q[i].n,message:$("msg").value,optInConfirmed:true})}),d=await r.json();if(!r.ok)throw Error(d.error);q[i].sent=true;render();let sent=q.filter(x=>x.sent).length;if(sent&&sent%30===0){cool=true;render();$("timer").textContent="ISTIRAHAT 1 JAM";setTimeout(()=>{cool=false;render()},3600000)}else if(q.some(x=>!x.sent)){let s=Math.floor(Math.random()*31)+60;delay(s,()=>{busy=false;render()});return}}catch(e){alert(e.message)}busy=false;render()}
$("load").onclick=()=>{if(!$("ok").checked)return alert("Centang konfirmasi opt-in.");let a=$("nums").value.split(/\n/).map(x=>x.replace(/\D/g,"")).filter(x=>x.length>=8);if(!a.length)return alert("Nomor tidak valid.");q=a.map(n=>({n,sent:false}));render()};
async function status(){try{let d=await(await fetch("/api/status")).json();$("st").textContent=d.status.toUpperCase();if(d.status==="scan_qr")$("qr").innerHTML=d.qr?`<img src="${d.qr}">`:"";else if(d.status==="connected")$("qr").innerHTML=""}catch{$("st").textContent="ERROR"}}status();setInterval(status,3000);render();
</script></body></html>
