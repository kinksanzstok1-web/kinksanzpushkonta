<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kink Sanz | PushKontak QR</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(160deg,#06152f,#082b58,#04101f);color:#fff;min-height:100vh}
.wrap{max-width:720px;margin:auto;padding:22px}
.card{background:rgba(10,28,54,.88);border:1px solid #174a83;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 10px 30px #0005}
h1{margin:0 0 5px;color:#5ecbff}.sub{color:#9bb7d4}
label{display:block;margin:14px 0 7px;color:#cfe5ff;font-weight:700}
input,textarea{width:100%;border:1px solid #24598e;background:#071b34;color:#fff;border-radius:12px;padding:13px;font-size:15px}
textarea{min-height:120px;resize:vertical}
button{width:100%;border:0;border-radius:12px;padding:13px;margin-top:12px;font-weight:800;font-size:15px;cursor:pointer;background:#1198e8;color:#fff}
button:disabled{opacity:.45}
.qr{display:flex;justify-content:center;padding:12px}.qr img{width:260px;max-width:100%;background:#fff;padding:10px;border-radius:12px}
.status{font-weight:800}.ok{color:#62e6a4}.warn{color:#ffd166}.bad{color:#ff7474}
.notice{font-size:13px;color:#aac3dc;line-height:1.5}
.check{display:flex;gap:9px;align-items:flex-start;margin-top:12px;color:#d9eaff;font-size:13px}.check input{width:auto;margin-top:3px}
.log{font-family:monospace;font-size:12px;white-space:pre-wrap;color:#b9d4ed}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>KINK SANZ</h1>
    <div class="sub">PushKontak — QR WhatsApp</div>
  </div>

  <div class="card">
    <div>Status: <span id="status" class="status warn">Memuat...</span></div>
    <div id="qrbox" class="qr"></div>
    <div class="notice">
      Scan QR menggunakan WhatsApp pada HP pengirim. Gunakan fitur ini hanya
      untuk penerima yang memang sudah memberikan izin menerima pesan.
    </div>
  </div>

  <div class="card">
    <label>Nomor WhatsApp</label>
    <input id="number" placeholder="628xxxxxxxxxx">

    <label>Pesan</label>
    <textarea id="message" placeholder="Tulis pesan..."></textarea>

    <label class="check">
      <input type="checkbox" id="optin">
      <span>Saya memastikan nomor ini sudah memberikan izin (opt-in) untuk menerima pesan.</span>
    </label>

    <button id="send" disabled>KIRIM PESAN</button>
    <div id="result" class="notice"></div>
  </div>

  <div class="card">
    <div class="log" id="log">Log siap.</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

async function refresh(){
  try{
    const r = await fetch("/api/status");
    const d = await r.json();

    $("send").disabled = d.status !== "connected";

    if(d.status === "connected"){
      $("status").textContent = "TERSAMBUNG";
      $("status").className = "status ok";
      $("qrbox").innerHTML = "";
    } else if(d.status === "scan_qr"){
      $("status").textContent = "SCAN QR";
      $("status").className = "status warn";
      $("qrbox").innerHTML = d.qr ? `<img src="${d.qr}" alt="QR WhatsApp">` : "";
    } else {
      $("status").textContent = d.status.toUpperCase();
      $("status").className = "status warn";
    }

    if(d.lastError) $("log").textContent = d.lastError;
  }catch(e){
    $("status").textContent = "SERVER ERROR";
    $("status").className = "status bad";
  }
}

$("send").onclick = async () => {
  $("send").disabled = true;
  $("result").textContent = "Mengirim...";
  try{
    const r = await fetch("/api/send", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        number:$("number").value,
        message:$("message").value,
        optInConfirmed:$("optin").checked
      })
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || "Gagal");
    $("result").textContent = "Pesan berhasil dikirim.";
    $("log").textContent = "Terkirim ke " + $("number").value;
  }catch(e){
    $("result").textContent = e.message;
  }
  await refresh();
};

refresh();
setInterval(refresh,3000);
</script>
</body>
</html>
